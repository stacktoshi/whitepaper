<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcoin Whitepaper Day ’26 · Celebrating 18 years of Bitcoin</title>
<meta name="description" content="Bitcoin Whitepaper Day ’26 — Satoshi Nakamoto’s original announcement to the Cryptography Mailing List, 31 October 2008.">
<meta name="theme-color" content="#f8f4eb">
<link rel="icon" type="image/svg+xml" href="whitepaper/favicon.svg">
<style>
  @font-face { font-family: 'Cinzel'; src: url('whitepaper/fonts/Cinzel-400.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Cinzel'; src: url('whitepaper/fonts/Cinzel-500.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Cinzel'; src: url('whitepaper/fonts/Cinzel-600.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Cinzel'; src: url('whitepaper/fonts/Cinzel-700.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
  :root {
    --paper: #f8f4eb;
    --paper2: #fbf8f2;
    --ink: #191613;
    --ink2: #4b443c;
    --ink3: #8d8378;
    --orange: #c97a2c;
    --ink-rgb: 25, 22, 19;
    --bg1: #ece7dd; --bg2: #e2dbcf; --bg3: #d3cbbd;
    --display: 'Cinzel', 'Trajan Pro', Optima, 'Times New Roman', serif;
    --serif: 'Times New Roman', Times, Tinos, serif;
    --mono: 'Courier New', Courier, monospace;
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .26 0 0 0 0 .18 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink); font-family: var(--serif);
    background: radial-gradient(120% 90% at 50% 32%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    overflow-x: hidden;
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--grain); opacity: .45;
  }
  .page {
    position: relative; z-index: 1;
    padding: clamp(16px, 3vw, 36px) clamp(14px, 4vw, 38px) 56px;
  }
  .sheet {
    max-width: 1040px; margin: 0 auto;
    padding: clamp(24px, 4vw, 48px) clamp(20px, 5.4vw, 76px) clamp(24px, 3.4vw, 42px);
    background: var(--paper) var(--grain);
    border: 1px solid rgba(var(--ink-rgb), .1);
    box-shadow: 0 50px 120px rgba(52, 38, 22, .28), 0 8px 22px rgba(52, 38, 22, .14);
  }
  .masthead { text-align: center; padding-bottom: clamp(22px, 3vw, 32px); border-bottom: 1px solid rgba(var(--ink-rgb), .18); }
  .kicker {
    font: 600 10px/1 var(--display); letter-spacing: .34em; text-transform: uppercase;
    color: var(--orange);
  }
  h1 {
    margin: 12px 0 0;
    font: 500 clamp(32px, 4.4vw, 54px)/1.05 var(--display);
    letter-spacing: .005em; color: var(--ink);
    text-wrap: balance;
  }
  h1 .year { color: var(--orange); }
  .subtitle {
    margin: 12px 0 0;
    font: italic 400 clamp(18px, 2.2vw, 25px)/1.35 var(--serif);
    color: var(--ink2);
  }
  .rule { width: 58px; height: 1px; margin: 18px auto 0; background: var(--orange); opacity: .8; }
  .mail {
    margin-top: clamp(24px, 3.2vw, 32px);
    background: var(--paper2) var(--grain);
    border: 1px solid var(--ink);
    outline: 1px solid rgba(var(--ink-rgb), .2); outline-offset: 4px;
    box-shadow: 0 24px 60px rgba(52, 38, 22, .18);
  }
  .mail-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px 11px;
    border-bottom: 1px solid rgba(var(--ink-rgb), .18);
    font: 600 9.5px/1 var(--display); letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink3);
  }
  .mail-title { color: var(--orange); }
  .mail-stamp {
    margin-left: auto; font: 400 10.5px/1 var(--mono); letter-spacing: .02em;
    color: var(--ink3); text-transform: none; white-space: nowrap;
  }
  .mail-toggle {
    flex: none; border: 0; background: none; padding: 3px 0 3px 10px; cursor: pointer;
    font: 600 9px/1 var(--display); letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink3); transition: color .2s;
  }
  .mail-toggle:hover, .mail-toggle:focus-visible { color: var(--orange); outline: none; }
  .mail-fields { padding: 12px 22px 11px; border-bottom: 1px solid rgba(var(--ink-rgb), .18); }
  .mail-field { display: flex; align-items: baseline; gap: 14px; padding: 3px 0; }
  .mail-label {
    flex: none; width: 62px;
    font: 600 8.5px/1.4 var(--display); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink3);
  }
  .mail-value { font: 400 14px/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
  .mail-body {
    height: min(44vh, 430px); overflow-y: auto; padding: 18px 22px 24px;
    background: rgba(var(--ink-rgb), .018);
    scrollbar-width: thin; scrollbar-color: rgba(var(--ink-rgb), .28) transparent;
  }
  .mail-body::-webkit-scrollbar { width: 8px; }
  .mail-body::-webkit-scrollbar-thumb { background: rgba(var(--ink-rgb), .22); }
  .mail-text {
    margin: 0; white-space: pre-wrap; overflow-wrap: break-word;
    font: 400 15.5px/1.54 var(--mono); color: var(--ink);
  }
  .caret {
    display: inline-block; width: 1.5px; height: 1.02em; margin-left: 1px;
    background: var(--orange); vertical-align: -.12em;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .caption {
    margin: 24px 0 0; text-align: center;
    font: italic 13px/1.45 var(--serif); color: var(--ink3);
  }
  @media (max-width: 640px) {
    .mail-stamp { display: none; }
    .mail-toggle { margin-left: auto; }
    .mail-fields { padding-inline: 16px; }
    .mail-body { height: 48vh; min-height: 300px; padding-inline: 16px; }
    .mail-text { font-size: 13.5px; }
    .mail-label { width: 54px; }
    .mail-value { font-size: 12.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }
</style>
</head>
<body>
<main class="page">
  <article class="sheet">
    <header class="masthead">
      <div class="kicker">31 · X · MMXXVI</div>
      <h1>Bitcoin Whitepaper Day <span class="year">’26</span></h1>
      <p class="subtitle">Celebrating 18 years of Bitcoin</p>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <section class="mail" aria-label="Satoshi Nakamoto’s original Bitcoin announcement email">
      <div class="mail-bar">
        <span class="mail-title">New message</span>
        <span class="mail-stamp">31 OCT 2008 · 14:10 EDT</span>
        <button class="mail-toggle" id="mailToggle" type="button" aria-label="Skip to the end">Skip</button>
      </div>
      <div class="mail-fields">
        <div class="mail-field"><span class="mail-label">To</span><span class="mail-value"><!--email_off-->majordomo&#64;metzdowd.com<!--/email_off--></span></div>
        <div class="mail-field"><span class="mail-label">Subject</span><span class="mail-value">Bitcoin P2P e-cash paper</span></div>
      </div>
      <div class="mail-body" id="mailBody">
        <div class="mail-text" id="mailText"><span id="typed"></span><span class="caret" id="caret" aria-hidden="true"></span></div>
      </div>
    </section>

    <p class="caption">Satoshi Nakamoto’s announcement to the Cryptography Mailing List · 31 October 2008</p>
  </article>
</main>

<script>
  const FULL = [
    "I've been working on a new electronic cash system that's fully",
    "peer-to-peer, with no trusted third party.",
    "",
    "The paper is available at:",
    "http://www.bitcoin.org/bitcoin.pdf",
    "",
    "The main properties:",
    " Double-spending is prevented with a peer-to-peer network.",
    " No mint or other trusted parties.",
    " Participants can be anonymous.",
    " New coins are made from Hashcash style proof-of-work.",
    " The proof-of-work for new coin generation also powers the",
    "    network to prevent double-spending.",
    "",
    "Bitcoin: A Peer-to-Peer Electronic Cash System",
    "",
    "Abstract.  A purely peer-to-peer version of electronic cash would",
    "allow online payments to be sent directly from one party to another",
    "without the burdens of going through a financial institution.",
    "Digital signatures provide part of the solution, but the main",
    "benefits are lost if a trusted party is still required to prevent",
    "double-spending.  We propose a solution to the double-spending",
    "problem using a peer-to-peer network.  The network timestamps",
    "transactions by hashing them into an ongoing chain of hash-based",
    "proof-of-work, forming a record that cannot be changed without",
    "redoing the proof-of-work.  The longest chain not only serves as",
    "proof of the sequence of events witnessed, but proof that it came",
    "from the largest pool of CPU power.  As long as honest nodes control",
    "the most CPU power on the network, they can generate the longest",
    "chain and outpace any attackers.  The network itself requires",
    "minimal structure.  Messages are broadcast on a best effort basis,",
    "and nodes can leave and rejoin the network at will, accepting the",
    "longest proof-of-work chain as proof of what happened while they",
    "were gone.",
    "",
    "Full paper at:",
    "http://www.bitcoin.org/bitcoin.pdf",
    "",
    "Satoshi Nakamoto"
  ].join("\n");

  const body = document.getElementById('mailBody');
  const typed = document.getElementById('typed');
  const caret = document.getElementById('caret');
  const toggle = document.getElementById('mailToggle');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CHAR_MS = 125;       // 80 wpm, counting spaces
  const SENTENCE_MS = 500;
  const PARAGRAPH_MS = 1500;
  let timer = 0, index = 0, typing = false;

  function render(n) {
    typed.textContent = FULL.slice(0, n);
    body.scrollTop = body.scrollHeight;
  }

  function finish(atTop) {
    clearTimeout(timer);
    index = FULL.length;
    render(index);
    if (atTop) body.scrollTop = 0;
    typing = false;
    caret.style.display = 'none';
    toggle.textContent = 'Replay';
    toggle.setAttribute('aria-label', 'Replay the typing animation');
  }

  function tick() {
    if (!typing) return;
    if (index >= FULL.length) { finish(false); return; }
    const ch = FULL[index++];
    render(index);
    let delay = CHAR_MS;
    if (ch === '\n' && FULL[index - 2] === '\n') {
      // A blank-line break is the paragraph pause; wrapped lines type straight on.
      delay += PARAGRAPH_MS;
    } else if (/[.!?]/.test(ch) && (index >= FULL.length || /\s/.test(FULL[index]))) {
      delay += SENTENCE_MS;
    }
    timer = setTimeout(tick, delay);
  }

  function start() {
    clearTimeout(timer);
    index = 0;
    render(0);
    if (reduceMotion) { finish(true); return; }
    typing = true;
    caret.style.display = '';
    toggle.textContent = 'Skip';
    toggle.setAttribute('aria-label', 'Skip to the end');
    timer = setTimeout(tick, 800);
  }

  toggle.addEventListener('click', () => {
    if (typing) finish(true);
    else start();
  });

  start();
</script>
</body>
</html>
